server:
    port: 9192


spring:
    datasource:
        username: springuser
        password: 1234
        url: JDBC:mysql://localhost:3306/library_db
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
            format-sql: true
    web:
        cors:
            mappings:
                - path: "/**"
                  allowed-origins: "http://localhost:3000"
                  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                  allowed-headers: "*"
                  allow-credentials: true



latefees:
    cron: "0 0 2 * * *" # Schedule to run at 2 AM every day